<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Streaming Services & Apps</title>
    <script>
        (function() {
            const savedScale = localStorage.getItem('system_display_scale');
            if (savedScale) {
                const factor = parseFloat(savedScale) / 100;
                try {
                    const { webFrame } = require('electron');
                    webFrame.setZoomFactor(factor);
                } catch(e) {
                    document.documentElement.style.zoom = factor;
                }
            }
        })();
    </script>
    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: #141414;
            --panel-active: #2a2a2a;
            --text-color: #ffffff;
            --text-muted: #888888;
            --accent-color: #ffd700;
            --danger-color: #ff4757;
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Fixed Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 72px;
            box-sizing: border-box;
            width: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.5) 70%, transparent 100%);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            height: 32px;
            width: auto;
            object-fit: contain;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .clock {
            font-size: 1.25rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
            margin-right: 6px;
        }

        .nav-btn {
            background-color: rgba(0, 0, 0, 0.65);
            border-radius: 50%;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--accent-color);
        }

        .nav-btn:hover {
            transform: scale(1.08);
            background-color: rgba(42, 42, 42, 0.95);
            border-color: var(--accent-color);
            box-shadow: 0 0 16px rgba(255, 215, 0, 0.35);
        }

        .nav-btn:active {
            transform: scale(0.95);
        }

        .nav-btn.active {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            box-shadow: 0 0 18px rgba(255, 215, 0, 0.6);
        }

        .nav-btn.active svg {
            stroke: #000000;
        }

        .nav-btn svg {
            width: 24px;
            height: 24px;
            stroke: var(--accent-color);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.2s ease;
        }

        /* Dynamic Banner Section */
        .banner-container {
            position: relative;
            width: 100%;
            height: 60vh;
            min-height: 480px;
            background-color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .banner-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center 25%;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 0 72px 100px 72px;
            box-sizing: border-box;
            z-index: 1;
        }

        .banner-slide.active {
            opacity: 1;
            z-index: 2;
        }

        .banner-fade {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            background: linear-gradient(to bottom, transparent 0%, var(--bg-color) 100%);
            z-index: 10;
            pointer-events: none;
        }

        .banner-content {
            position: relative;
            z-index: 15;
            max-width: 880px;
            text-shadow: 0 4px 12px rgba(0,0,0,0.9);
        }

        .banner-tag-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .banner-tag {
            display: inline-block;
            background-color: var(--accent-color);
            color: #000;
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 6px 12px;
            border-radius: 4px;
        }

        .broadcast-pill {
            background: rgba(255, 255, 255, 0.16);
            color: #fff;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 700;
            backdrop-filter: blur(6px);
        }

        .live-pulse {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse-dot 1.2s infinite;
        }
        @keyframes pulse-dot {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }

        .inline-provider-logo {
            height: 26px;
            width: auto;
            object-fit: contain;
            opacity: 0.9;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
        }

        .banner-title {
            font-size: 3.2rem;
            font-weight: 800;
            margin: 0 0 10px 0;
            line-height: 1.15;
        }

        .banner-desc {
            font-size: 1.15rem;
            color: #e0e0e0;
            margin: 0;
            font-weight: 500;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.6;
            max-width: 780px;
        }

        /* Redesigned Centered ESPN Broadcast Slide */
        .banner-slide.espn-banner-slide {
            justify-content: center;
            align-items: center;
            padding: 24px 72px 64px 72px;
            text-align: center;
        }

        .espn-full-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1040px;
            z-index: 15;
            text-shadow: none !important;
        }

        .espn-top-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 22px;
            background: rgba(0, 0, 0, 0.45);
            padding: 6px 18px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .espn-brand-icon {
            height: 18px;
            width: auto;
            object-fit: contain;
        }

        .espn-league-badge {
            background: var(--accent-color);
            color: #000;
            font-size: 0.8rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        .espn-grand-scoreboard {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 32px;
            width: 100%;
            background: rgba(14, 14, 18, 0.68);
            border: 1px solid rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 26px 44px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
            box-sizing: border-box;
        }

        .espn-grand-team {
            display: flex;
            align-items: center;
            gap: 20px;
            flex: 1;
        }
        .espn-grand-team.away {
            justify-content: flex-end;
        }
        .espn-grand-team.home {
            justify-content: flex-start;
        }

        .espn-grand-logo {
            width: 76px;
            height: 76px;
            object-fit: contain;
            filter: drop-shadow(0 6px 14px rgba(0,0,0,0.6));
            flex-shrink: 0;
        }

        .espn-grand-meta {
            display: flex;
            flex-direction: column;
            text-align: right;
        }
        .espn-grand-meta.home {
            text-align: left;
        }

        .espn-grand-name {
            font-size: 1.55rem;
            font-weight: 800;
            color: #ffffff;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        .espn-grand-record {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .espn-grand-score {
            font-size: 3.4rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: #ffffff;
            min-width: 56px;
            text-align: center;
            line-height: 1;
        }

        .espn-grand-score.winner {
            color: var(--accent-color);
        }

        .espn-grand-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 24px;
            border-left: 1px solid rgba(255, 255, 255, 0.12);
            border-right: 1px solid rgba(255, 255, 255, 0.12);
            min-width: 105px;
        }

        .espn-clock-main {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--accent-color);
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .espn-clock-sub {
            font-size: 0.85rem;
            color: #bbb;
            margin-top: 4px;
            white-space: nowrap;
        }

        .espn-btn-group {
            margin-top: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        /* Banner Buttons - Ultra Clean & Crisp (No Dropshadow on Text) */
        .banner-btn-group {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 36px;
        }

        .banner-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 36px;
            padding: 13px 32px;
            background: #ffffff;
            color: #000000;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: 0.2px;
            border-radius: 9999px;
            border: none;
            text-shadow: none !important;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            cursor: pointer;
            line-height: 1;
        }

        .banner-btn * {
            text-shadow: none !important;
        }
        
        .banner-btn-group .banner-btn {
            margin-top: 0;
        }

        .banner-btn svg {
            width: 16px;
            height: 16px;
            fill: #000000;
            stroke: none;
            flex-shrink: 0;
        }

        .banner-btn:hover {
            background: #ffd700;
            color: #000000;
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 6px 22px rgba(255, 215, 0, 0.45);
            text-shadow: none !important;
        }
        
        .banner-btn:active {
            transform: translateY(0) scale(0.97);
        }

        .banner-btn.secondary-btn {
            background: rgba(255, 255, 255, 0.14);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.32);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            text-shadow: none !important;
        }

        .banner-btn.secondary-btn svg {
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
        }

        .banner-btn.secondary-btn:hover {
            background: rgba(255, 255, 255, 0.26);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.85);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            transform: translateY(-2px) scale(1.03);
            text-shadow: none !important;
        }

        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* App Categories & Horizontal Scrolling */
        .content-wrapper {
            position: relative;
            z-index: 20; 
            margin-top: -60px; 
            padding-bottom: 80px;
        }

        .category-section {
            padding: 16px 0; 
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .section-header-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 72px;
            z-index: 25; 
        }

        .header-title-box {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .category-title {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-color);
            margin: 0;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .nav-controls {
            display: flex;
            gap: 12px;
        }

        .nav-arrow {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .nav-arrow:hover {
            background: rgba(255, 215, 0, 0.15);
            border-color: var(--accent-color);
            color: var(--accent-color);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5), inset 0 0 10px rgba(255, 215, 0, 0.2);
            transform: scale(1.1);
        }

        .nav-arrow:active {
            transform: scale(0.95);
        }

        .carousel-container {
            position: relative;
            width: 100%;
        }

        .carousel-row {
            display: flex;
            gap: 28px;
            overflow-x: auto;
            padding: 60px 72px 80px 72px; 
            margin-top: -30px; 
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scroll-snap-type: x mandatory;
            scroll-padding: 0 72px;
            scrollbar-width: none; 
            -ms-overflow-style: none; 
        }

        .carousel-row::-webkit-scrollbar {
            display: none;
        }

        /* Glassmorphism & Brand Glow Cards */
        .app-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            text-decoration: none;
            flex: 0 0 auto; 
            width: 140px;
            scroll-snap-align: start;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .app-wrapper.is-dragging {
            opacity: 0.35;
            transform: scale(0.92);
        }

        .app-wrapper.drag-over {
            transform: scale(1.08);
        }
        .app-wrapper.drag-over .card {
            border-color: var(--accent-color);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }

        .card {
            width: 140px;
            height: 140px;
            border-radius: 50%; 
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.4s ease, background 0.4s ease, box-shadow 0.4s ease;
        }

        .card .glow {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--brand, var(--accent-color));
            filter: blur(30px); 
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
            pointer-events: none;
        }

        .card-logo {
            width: 75px;
            height: 75px;
            object-fit: contain;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 2;
        }
        
        .card-label {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-muted);
            text-align: center;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
            width: 100%;
            transition: color 0.3s ease;
        }

        .app-wrapper:hover .card {
            transform: translateY(-16px) scale(1.05); 
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }

        .app-wrapper:hover .card .glow {
            opacity: 0.55; 
        }

        .app-wrapper:hover .card-logo {
            transform: scale(1.15);
        }

        .app-wrapper:active .card {
            transform: scale(0.95);
        }

        .app-wrapper:hover .card-label {
            color: var(--text-color);
        }

        /* Edit Mode Badges and Controls */
        .delete-app-btn {
            position: absolute;
            top: 2px;
            right: 8px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #ff334b;
            color: #fff;
            border: 2px solid #000;
            font-size: 18px;
            font-weight: bold;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 30;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            transition: transform 0.15s ease, background 0.15s ease;
        }
        .delete-app-btn:hover {
            transform: scale(1.2);
            background: #ff0022;
        }

        .reorder-bar {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: -6px;
            z-index: 25;
        }

        .reorder-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 6px;
            width: 28px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: 800;
            font-size: 16px;
            transition: all 0.15s ease;
        }
        .reorder-btn:hover:not(:disabled) {
            background: var(--accent-color);
            color: #000;
        }
        .reorder-btn:disabled {
            opacity: 0.2;
            cursor: default;
        }

        /* When in Edit Mode */
        body.edit-mode .app-wrapper.editable .delete-app-btn {
            display: flex;
        }
        body.edit-mode .app-wrapper.editable .reorder-bar {
            display: flex;
        }
        body.edit-mode .app-wrapper.editable .card {
            border-style: dashed;
            border-color: rgba(255, 215, 0, 0.45);
        }

        /* + Add App Card */
        .add-card {
            border: 2px dashed rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.02);
        }
        .add-card:hover {
            border-color: var(--accent-color);
            background: rgba(255, 215, 0, 0.08);
            transform: translateY(-10px) scale(1.05);
        }
        .add-card svg {
            width: 44px;
            height: 44px;
            stroke: var(--accent-color);
            fill: none;
            stroke-width: 2;
        }

        .invert-dark { filter: brightness(0) invert(1); }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-container {
            background: #18181c;
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.9);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 24px 28px 16px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .modal-title {
            margin: 0;
            font-size: 1.4rem;
            color: var(--accent-color);
            font-weight: 700;
        }

        .close-modal-btn {
            background: transparent;
            border: none;
            color: #888;
            font-size: 28px;
            line-height: 1;
            cursor: pointer;
            transition: color 0.2s ease;
        }
        .close-modal-btn:hover { color: #fff; }

        .modal-body {
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 0.95rem;
            font-weight: 600;
            color: #ccc;
        }

        .form-input, .form-select {
            background: #0d0d10;
            border: 1px solid #333;
            color: #fff;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease;
        }
        .form-input:focus, .form-select:focus {
            border-color: var(--accent-color);
        }

        .form-helper {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .btn-sm {
            background: rgba(255, 215, 0, 0.15);
            color: var(--accent-color);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-sm:hover { background: rgba(255, 215, 0, 0.3); }

        .color-presets {
            display: flex;
            gap: 10px;
        }
        .color-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .color-dot:hover {
            transform: scale(1.2);
            border-color: #fff;
        }

        .modal-footer {
            padding: 16px 28px 24px 28px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .modal-btn {
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }
        .modal-btn.primary {
            background: var(--accent-color);
            color: #000;
        }
        .modal-btn.primary:hover {
            background: #ffe234;
            box-shadow: 0 4px 16px rgba(255,215,0,0.4);
        }
        .modal-btn.secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #ccc;
        }
        .modal-btn.secondary:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }

        .reset-defaults-btn {
            background: none;
            border: 1px solid #444;
            color: #888;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .reset-defaults-btn:hover {
            border-color: var(--danger-color);
            color: var(--danger-color);
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <img src="https://resources.jakerowe.me/logos/rowe/logo-white.png" alt="Rowe Logo" class="logo">
        </div>
        
        <div class="header-right">
            <div id="clock" class="clock"></div>

            <!-- Customize Apps Icon Button (No Text) -->
            <button id="customize-btn" class="nav-btn" aria-label="Customize Apps" title="Customize Apps" onclick="toggleEditMode()">
                <svg viewBox="0 0 24 24">
                    <path d="M12 20h9"></path>
                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                </svg>
            </button>

            <!-- Settings Button -->
            <a href="settings.html" class="nav-btn" aria-label="Settings" title="Settings">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </a>
        </div>
    </header>

    <!-- DYNAMIC BANNER SECTION -->
    <div id="banner-root" class="banner-container">
        <div class="loader" id="banner-loader"></div>
        <div class="banner-fade"></div>
    </div>

    <!-- MAIN APP GRID CONTAINER -->
    <div class="content-wrapper" id="content-root"></div>

    <!-- ADD APP MODAL -->
    <div id="add-app-modal" class="modal-overlay" onclick="if(event.target===this) closeAddModal()">
        <div class="modal-container">
            <div class="modal-header">
                <h3 class="modal-title">Add Application</h3>
                <button class="close-modal-btn" onclick="closeAddModal()">&times;</button>
            </div>
            
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Category</label>
                    <select id="new-app-category" class="form-select">
                        <option value="movies_tv">Movies and TV</option>
                        <option value="music">Music</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Application Name</label>
                    <input type="text" id="new-app-name" class="form-input" placeholder="e.g. Plex, Twitch, SoundCloud">
                </div>

                <div class="form-group">
                    <label class="form-label">Website URL</label>
                    <input type="url" id="new-app-url" class="form-input" placeholder="https://..." onblur="autoSuggestDetails()">
                    <span class="form-helper">Enter web address. It will launch in the full-screen kiosk viewer.</span>
                </div>

                <div class="form-group">
                    <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: #ddd; font-size: 0.95rem;">
                        <input type="checkbox" id="new-app-tv-mode" style="width: 18px; height: 18px; accent-color: var(--accent-color);">
                        Enable TV Mode (Use Smart TV User Agent)
                    </label>
                </div>

                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label class="form-label">Logo / Icon URL</label>
                        <button type="button" class="btn-sm" onclick="autoDetectLogo()">Auto-Detect Logo</button>
                    </div>
                    <input type="url" id="new-app-logo" class="form-input" placeholder="https://... (or click Auto-Detect)" oninput="updateLogoPreview()">
                    <div id="logo-preview-box" style="margin-top: 6px; display: none; align-items: center; gap: 10px;">
                        <span style="font-size: 0.85rem; color: #888;">Preview:</span>
                        <img id="logo-preview-img" src="" style="width: 40px; height: 40px; object-fit: contain; border-radius: 8px; background: rgba(255,255,255,0.06); padding: 4px;">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Brand Glow Color</label>
                    <div style="display: flex; align-items: center; gap: 14px;">
                        <input type="color" id="new-app-color" value="#FFD700" style="width: 44px; height: 44px; border: none; border-radius: 8px; cursor: pointer; background: transparent;">
                        <div class="color-presets">
                            <span class="color-dot" style="background: #E50914;" onclick="setNewColor('#E50914')" title="Red"></span>
                            <span class="color-dot" style="background: #00A8E1;" onclick="setNewColor('#00A8E1')" title="Blue"></span>
                            <span class="color-dot" style="background: #1CE783;" onclick="setNewColor('#1CE783')" title="Green"></span>
                            <span class="color-dot" style="background: #9146FF;" onclick="setNewColor('#9146FF')" title="Purple"></span>
                            <span class="color-dot" style="background: #FFD700;" onclick="setNewColor('#FFD700')" title="Gold"></span>
                            <span class="color-dot" style="background: #FF0000;" onclick="setNewColor('#FF0000')" title="YouTube Red"></span>
                            <span class="color-dot" style="background: #0064FF;" onclick="setNewColor('#0064FF')" title="Cyan/Navy"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button class="modal-btn secondary" onclick="closeAddModal()">Cancel</button>
                <button class="modal-btn primary" onclick="saveNewApp()">Add App</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        const CONFIG = {
            tmdbApiKey: '',
            jellyfinUrl: '', 
            jellyfinUserId: '',
            jellyfinApiKey: ''
        };

        const bannerRoot = document.getElementById('banner-root');
        const loader = document.getElementById('banner-loader');

        // Clock Logic
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('clock').innerText = `${hours}:${minutes} ${ampm}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ==========================================
        // APP MANAGEMENT & SECTIONS: MOVIES & TV, MUSIC, UTILITIES
        // ==========================================
        const DEFAULT_APPS = {
            movies_tv: [
                { id: 'netflix', name: 'Netflix', url: 'viewer.html?url=https://www.netflix.com', brand: '#E50914', logo: 'https://thumb.wikimedia.org/wikipedia/commons/thumb/1/18/Netflix_2016_N_logo.svg/960px-Netflix_2016_N_logo.svg.png' },
                { id: 'hulu', name: 'Hulu', url: 'viewer.html?url=https://www.hulu.com', brand: '#1CE783', logo: 'https://upload.wikimedia.org/wikipedia/commons/0/03/Hulu_logo_%282014%29.svg' },
                { id: 'max', name: 'Max', url: 'viewer.html?url=https://www.max.com', brand: '#022CE7', logo: 'https://upload.wikimedia.org/wikipedia/commons/c/ce/Max_logo.svg', invertDark: true },
                { id: 'disneyplus', name: 'Disney+', url: 'viewer.html?url=https://www.disneyplus.com', brand: '#113CCF', logo: 'https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg', invertDark: true },
                { id: 'primevideo', name: 'Prime Video', url: 'viewer.html?url=https://www.primevideo.com', brand: '#00A8E1', logo: 'https://upload.wikimedia.org/wikipedia/commons/1/11/Amazon_Prime_Video_logo.svg' },
                { id: 'appletv', name: 'Apple TV+', url: 'viewer.html?url=https://tv.apple.com', brand: '#FFFFFF', logo: 'https://upload.wikimedia.org/wikipedia/commons/2/28/Apple_TV_Plus_Logo.svg', invertDark: true },
                { id: 'peacock', name: 'Peacock', url: 'viewer.html?url=https://www.peacocktv.com', brand: '#FFFFFF', logo: 'https://upload.wikimedia.org/wikipedia/commons/f/fb/NBCUniversal_Peacock_Logo_%282020%E2%80%932026%29.svg' },
                { id: 'paramountplus', name: 'Paramount+', url: 'viewer.html?url=https://www.paramountplus.com', brand: '#0064FF', logo: 'https://upload.wikimedia.org/wikipedia/commons/a/a5/Paramount_Plus.svg' },
                { id: 'crunchyroll', name: 'Crunchyroll', url: 'viewer.html?url=https://www.crunchyroll.com', brand: '#F47521', logo: 'https://upload.wikimedia.org/wikipedia/commons/f/f6/Crunchyroll_Logo.svg' },
                { id: 'youtube', name: 'YouTube', url: 'viewer.html?url=https://www.youtube.com/tv&ua=tv', brand: '#FF0000', logo: 'https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg' },
                { id: 'plutotv', name: 'Pluto TV', url: 'viewer.html?url=https://pluto.tv', brand: '#F5D211', logo: 'https://upload.wikimedia.org/wikipedia/commons/c/c3/Pluto_TV_logo_2024.svg', invertDark: true },
                { id: 'espn', name: 'ESPN', url: 'viewer.html?url=https://www.espn.com', brand: '#CC0000', logo: 'https://upload.wikimedia.org/wikipedia/commons/2/2f/ESPN_wordmark.svg' },
                { id: 'jellyfin', name: 'Jellyfin', url: 'viewer.html?url=https://library.rowenetwork.com', brand: '#8B51A5', logo: 'https://upload.wikimedia.org/wikipedia/commons/4/41/Jellyfin_-_icon-transparent.svg', invertDark: true },
                { id: 'foxone', name: 'Fox One', url: 'viewer.html?url=https://www.fox.com/', brand: '#183A68', logo: 'https://upload.wikimedia.org/wikipedia/commons/7/77/Fox_One_2025.svg', invertDark: true }
            ],
            music: [
                { id: 'spotify', name: 'Spotify', url: 'viewer.html?url=https://open.spotify.com', brand: '#1DB954', logo: 'https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg' },
                { id: 'ytmusic', name: 'YouTube Music', url: 'viewer.html?url=https://music.youtube.com', brand: '#FF0000', logo: 'https://upload.wikimedia.org/wikipedia/commons/6/6a/Youtube_Music_icon.svg' }
            ],
            utilities: [
                { id: 'chrome', name: 'Google Chrome', url: 'viewer.html?url=https://www.google.com', brand: '#4285F4', logo: 'https://upload.wikimedia.org/wikipedia/commons/e/e1/Google_Chrome_icon_%28February_2022%29.svg' },
                { id: 'stats', name: 'Live Sports Stats', url: 'stats.html', brand: '#FFD700', svgIcon: 'stats' },
                { id: 'fast', name: 'Internet Speed Test', url: 'viewer.html?url=https://fast.com', brand: '#00e5ff', svgIcon: 'speed' },
                { id: 'weather', name: 'Weather Radar', url: 'viewer.html?url=https://weather.com', brand: '#0284C7', svgIcon: 'weather' },
                { id: 'settings', name: 'Device Settings', url: 'settings.html', brand: '#FFD700', svgIcon: 'settings' }
            ]
        };

        const CATEGORIES = [
            { key: 'movies_tv', title: 'Movies and TV', editable: true },
            { key: 'music', title: 'Music', editable: true },
            { key: 'utilities', title: 'Utilities', editable: false }
        ];

        let appData = loadApps();
        let isEditMode = false;
        let dragSource = null;

        function loadApps() {
            try {
                const saved = localStorage.getItem('streaming_pc_apps_v3');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed.movies_tv && parsed.music && parsed.utilities) return parsed;
                }
            } catch(e) {}
            return JSON.parse(JSON.stringify(DEFAULT_APPS));
        }

        function saveApps() {
            localStorage.setItem('streaming_pc_apps_v3', JSON.stringify(appData));
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            document.body.classList.toggle('edit-mode', isEditMode);
            const btn = document.getElementById('customize-btn');
            btn.classList.toggle('active', isEditMode);
            renderAppRows();
        }

        function getAppIconHtml(app) {
            if (app.svgIcon === 'stats') {
                return `<svg class="card-logo" viewBox="0 0 24 24" style="stroke: #fff; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>`;
            }
            if (app.svgIcon === 'speed') {
                return `<svg class="card-logo" viewBox="0 0 24 24" style="stroke: #fff; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;"><path d="M12 2v4"></path><path d="m4.93 4.93 2.83 2.83"></path><path d="M2 12h4"></path><path d="m4.93 19.07 2.83-2.83"></path><path d="M12 22v-4"></path><path d="m19.07 19.07-2.83-2.83"></path><path d="M22 12h-4"></path><path d="m19.07 4.93-2.83 2.83"></path><path d="M12 12l4-4"></path></svg>`;
            }
            if (app.svgIcon === 'weather') {
                return `<svg class="card-logo" viewBox="0 0 24 24" style="stroke: #fff; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>`;
            }
            if (app.svgIcon === 'settings') {
                return `<svg class="card-logo" viewBox="0 0 24 24" style="stroke: #ffd700; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>`;
            }
            const invertClass = app.invertDark ? 'invert-dark' : '';
            return `<img src="${app.logo || 'https://resources.jakerowe.me/logos/rowe/logo-white.png'}" alt="${app.name}" class="card-logo ${invertClass}" onerror="this.src='https://resources.jakerowe.me/logos/rowe/logo-white.png'">`;
        }

        function renderAppRows() {
            const root = document.getElementById('content-root');
            let html = '';

            CATEGORIES.forEach(cat => {
                const apps = appData[cat.key] || [];
                const isEditable = cat.editable;

                const cardsHtml = apps.map((app, index) => {
                    const iconHtml = getAppIconHtml(app);
                    const editableClass = isEditable ? 'editable' : '';

                    return `
                        <div class="app-wrapper ${editableClass}" 
                             style="--brand: ${app.brand || '#ffd700'};" 
                             title="${app.name}"
                             draggable="${isEditable && isEditMode}"
                             ondragstart="${isEditable ? `onDragStart(event, '${cat.key}', ${index})` : ''}"
                             ondragover="${isEditable ? 'onDragOver(event)' : ''}"
                             ondragenter="${isEditable ? 'onDragEnter(event)' : ''}"
                             ondragleave="${isEditable ? 'onDragLeave(event)' : ''}"
                             ondrop="${isEditable ? `onDrop(event, '${cat.key}', ${index})` : ''}"
                             ondragend="${isEditable ? 'onDragEnd(event)' : ''}"
                             onclick="if(!isEditMode) { window.location.href='${app.url}'; }">
                            
                            ${isEditable ? `<button class="delete-app-btn" onclick="event.stopPropagation(); removeApp('${cat.key}', ${index})" title="Remove ${app.name}">&times;</button>` : ''}
                            
                            <div class="card">
                                <div class="glow"></div>
                                ${iconHtml}
                            </div>
                            <span class="card-label">${app.name}</span>
                            
                            ${isEditable ? `
                                <div class="reorder-bar" onclick="event.stopPropagation();">
                                    <button class="reorder-btn" onclick="moveApp('${cat.key}', ${index}, -1)" ${index === 0 ? 'disabled' : ''} title="Move Left">&lsaquo;</button>
                                    <button class="reorder-btn" onclick="moveApp('${cat.key}', ${index}, 1)" ${index === apps.length - 1 ? 'disabled' : ''} title="Move Right">&rsaquo;</button>
                                </div>
                            ` : ''}
                        </div>
                    `;
                }).join('');

                const addCardHtml = isEditable ? `
                    <div class="app-wrapper add-app-card" onclick="openAddModal('${cat.key}')" title="Add Application">
                        <div class="card add-card">
                            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        </div>
                        <span class="card-label" style="color: var(--accent-color);">+ Add App</span>
                    </div>
                ` : '';

                html += `
                    <div class="category-section" id="section-${cat.key}">
                        <div class="section-header-wrapper">
                            <div class="header-title-box">
                                <h2 class="category-title">${cat.title}</h2>
                                ${isEditable && isEditMode ? `<button class="reset-defaults-btn" onclick="resetDefaults('${cat.key}')">Restore Defaults</button>` : ''}
                            </div>
                            <div class="nav-controls">
                                <button class="nav-arrow left" aria-label="Scroll left">&#8249;</button>
                                <button class="nav-arrow right" aria-label="Scroll right">&#8250;</button>
                            </div>
                        </div>
                        
                        <div class="carousel-container">
                            <div class="carousel-row">
                                ${cardsHtml}
                                ${addCardHtml}
                            </div>
                        </div>
                    </div>
                `;
            });

            root.innerHTML = html;

            // Re-bind horizontal arrow navigation
            root.querySelectorAll('.category-section').forEach(section => {
                const row = section.querySelector('.carousel-row');
                const leftBtn = section.querySelector('.nav-arrow.left');
                const rightBtn = section.querySelector('.nav-arrow.right');

                if (leftBtn && rightBtn && row) {
                    leftBtn.addEventListener('click', () => row.scrollBy({ left: -420, behavior: 'smooth' }));
                    rightBtn.addEventListener('click', () => row.scrollBy({ left: 420, behavior: 'smooth' }));
                }
            });
        }

        function moveApp(catKey, index, delta) {
            const arr = appData[catKey];
            const targetIndex = index + delta;
            if (targetIndex < 0 || targetIndex >= arr.length) return;
            const [item] = arr.splice(index, 1);
            arr.splice(targetIndex, 0, item);
            saveApps();
            renderAppRows();
        }

        function removeApp(catKey, index) {
            const item = appData[catKey][index];
            if (confirm(`Remove "${item.name}" from your apps?`)) {
                appData[catKey].splice(index, 1);
                saveApps();
                renderAppRows();
            }
        }

        function resetDefaults(catKey) {
            if (confirm(`Reset ${catKey} apps back to system defaults?`)) {
                appData[catKey] = JSON.parse(JSON.stringify(DEFAULT_APPS[catKey]));
                saveApps();
                renderAppRows();
            }
        }

        function onDragStart(e, catKey, index) {
            dragSource = { catKey, index };
            e.currentTarget.classList.add('is-dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', `${catKey}:${index}`);
        }

        function onDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function onDragEnter(e) {
            const target = e.currentTarget;
            if (target && target.classList.contains('app-wrapper')) {
                target.classList.add('drag-over');
            }
        }

        function onDragLeave(e) {
            const target = e.currentTarget;
            if (target && target.classList.contains('app-wrapper')) {
                target.classList.remove('drag-over');
            }
        }

        function onDrop(e, catKey, targetIndex) {
            e.preventDefault();
            document.querySelectorAll('.app-wrapper').forEach(el => el.classList.remove('drag-over', 'is-dragging'));

            if (!dragSource || dragSource.catKey !== catKey) return;
            const srcIndex = dragSource.index;
            if (srcIndex === targetIndex) return;

            const arr = appData[catKey];
            const [item] = arr.splice(srcIndex, 1);
            arr.splice(targetIndex, 0, item);
            dragSource = null;
            saveApps();
            renderAppRows();
        }

        function onDragEnd(e) {
            document.querySelectorAll('.app-wrapper').forEach(el => el.classList.remove('drag-over', 'is-dragging'));
            dragSource = null;
        }

        // Add App Modal Logic
        function openAddModal(catKey = 'movies_tv') {
            document.getElementById('new-app-category').value = catKey === 'utilities' ? 'movies_tv' : catKey;
            document.getElementById('new-app-name').value = '';
            document.getElementById('new-app-url').value = '';
            document.getElementById('new-app-logo').value = '';
            document.getElementById('new-app-color').value = '#FFD700';
            document.getElementById('new-app-tv-mode').checked = false;
            document.getElementById('logo-preview-box').style.display = 'none';
            document.getElementById('add-app-modal').style.display = 'flex';
        }

        function closeAddModal() {
            document.getElementById('add-app-modal').style.display = 'none';
        }

        function setNewColor(hex) {
            document.getElementById('new-app-color').value = hex;
        }

        function autoSuggestDetails() {
            const urlVal = document.getElementById('new-app-url').value.trim();
            if (!urlVal) return;

            try {
                let fullUrl = urlVal;
                if (!fullUrl.startsWith('http://') && !fullUrl.startsWith('https://')) {
                    fullUrl = 'https://' + fullUrl;
                    document.getElementById('new-app-url').value = fullUrl;
                }
                const parsed = new URL(fullUrl);
                const hostParts = parsed.hostname.replace('www.', '').split('.');
                const brandName = hostParts[0].charAt(0).toUpperCase() + hostParts[0].slice(1);
                
                if (!document.getElementById('new-app-name').value) {
                    document.getElementById('new-app-name').value = brandName;
                }
                if (!document.getElementById('new-app-logo').value) {
                    autoDetectLogo();
                }
            } catch(e) {}
        }

        function autoDetectLogo() {
            const urlVal = document.getElementById('new-app-url').value.trim();
            if (!urlVal) {
                alert('Please enter a website URL first.');
                return;
            }
            try {
                let fullUrl = urlVal;
                if (!fullUrl.startsWith('http://') && !fullUrl.startsWith('https://')) {
                    fullUrl = 'https://' + fullUrl;
                }
                const parsed = new URL(fullUrl);
                const domain = parsed.hostname;
                const iconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;
                document.getElementById('new-app-logo').value = iconUrl;
                updateLogoPreview();
            } catch(e) {
                alert('Invalid URL format');
            }
        }

        function updateLogoPreview() {
            const val = document.getElementById('new-app-logo').value.trim();
            const box = document.getElementById('logo-preview-box');
            const img = document.getElementById('logo-preview-img');
            if (val) {
                img.src = val;
                box.style.display = 'flex';
            } else {
                box.style.display = 'none';
            }
        }

        function saveNewApp() {
            const cat = document.getElementById('new-app-category').value;
            const name = document.getElementById('new-app-name').value.trim();
            let urlVal = document.getElementById('new-app-url').value.trim();
            const logoVal = document.getElementById('new-app-logo').value.trim();
            const colorVal = document.getElementById('new-app-color').value;
            const isTv = document.getElementById('new-app-tv-mode').checked;

            if (!name) {
                alert('Please enter an application name.');
                return;
            }
            if (!urlVal) {
                alert('Please enter a website URL.');
                return;
            }

            if (!urlVal.startsWith('http://') && !urlVal.startsWith('https://') && !urlVal.endsWith('.html')) {
                urlVal = 'https://' + urlVal;
            }

            let launchUrl = urlVal;
            if (urlVal.startsWith('http://') || urlVal.startsWith('https://')) {
                launchUrl = `viewer.html?url=${encodeURIComponent(urlVal)}${isTv ? '&ua=tv' : ''}`;
            }

            const newApp = {
                id: 'custom_' + Date.now(),
                name,
                url: launchUrl,
                brand: colorVal || '#ffd700',
                logo: logoVal || `https://www.google.com/s2/favicons?domain=${urlVal}&sz=128`
            };

            if (!appData[cat]) appData[cat] = [];
            appData[cat].push(newApp);
            saveApps();
            renderAppRows();
            closeAddModal();
        }

        // ==========================================
        // DYNAMIC BANNER SLIDES (TMDB, JELLYFIN, ESPN)
        // ==========================================
        function buildSlide(tag, tagColor, title, desc, bgUrl, linkUrl = null, btnText = "Watch Now", logoUrl = null, invertLogo = false) {
            let btnHtml = '';
            if (linkUrl) {
                btnHtml = `
                    <div class="banner-btn-group">
                        <a href="${linkUrl}" class="banner-btn">
                            <svg viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
                            ${btnText}
                        </a>
                    </div>
                `;
            }
            
            let logoHtml = '';
            if (logoUrl) {
                const filterClass = invertLogo ? 'invert-dark' : '';
                logoHtml = `<img src="${logoUrl}" class="inline-provider-logo ${filterClass}" alt="Provider Logo">`;
            }

            return `
                <div class="banner-slide" style="background-image: linear-gradient(to right, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.18) 70%), url('${bgUrl}');">
                    <div class="banner-content">
                        <div class="banner-tag-group">
                            <span class="banner-tag" style="background-color: ${tagColor}; color: ${tagColor === '#ffffff' ? '#000' : '#fff'};">${tag}</span>
                            ${logoHtml}
                        </div>
                        <h2 class="banner-title">${title}</h2>
                        <p class="banner-desc">${desc}</p>
                        ${btnHtml}
                    </div>
                </div>
            `;
        }

        async function fetchInTheaters() {
            try {
                if(!CONFIG.tmdbApiKey || CONFIG.tmdbApiKey.includes('YOUR_TMDB')) throw new Error("Missing TMDB API Key");
                const res = await fetch(`https://api.themoviedb.org/3/movie/now_playing?api_key=${CONFIG.tmdbApiKey}&language=en-US&page=1`);
                if (!res.ok) throw new Error(`HTTP Error`);
                const data = await res.json();
                
                const maxItems = Math.min(5, data.results.length);
                const randomIndex = Math.floor(Math.random() * maxItems);
                const movie = data.results[randomIndex];
                
                const bgUrl = `https://image.tmdb.org/t/p/original${movie.backdrop_path}`;
                const tmdbLogo = `https://www.themoviedb.org/assets/2/v4/logos/v2/blue_short-8e7b30f73a4020692ccca9c88bafe5dcb6f8a62a4c6bc55cd9ba82bb2cd95f6c.svg`;
                const tmdbUrl = `viewer.html?url=${encodeURIComponent('https://www.themoviedb.org/movie/' + movie.id)}`;
                
                return [buildSlide('In Theaters', '#e50914', movie.title, movie.overview, bgUrl, tmdbUrl, 'Watch Trailer', tmdbLogo)];
            } catch (err) {
                console.warn('In Theaters fetch failed:', err.message);
                return []; 
            }
        }

        async function fetchTrending() {
            try {
                if(!CONFIG.tmdbApiKey || CONFIG.tmdbApiKey.includes('YOUR_TMDB')) throw new Error("Missing TMDB API Key");
                const res = await fetch(`https://api.themoviedb.org/3/trending/all/day?api_key=${CONFIG.tmdbApiKey}`);
                if (!res.ok) throw new Error(`HTTP Error`);
                const data = await res.json();
                
                const maxItems = Math.min(5, data.results.length);
                const randomIndex = Math.floor(Math.random() * maxItems);
                const item = data.results[randomIndex];
                
                const title = item.title || item.name;
                const bgUrl = `https://image.tmdb.org/t/p/original${item.backdrop_path}`;
                const tmdbLogo = `https://www.themoviedb.org/assets/2/v4/logos/v2/blue_short-8e7b30f73a4020692ccca9c88bafe5dcb6f8a62a4c6bc55cd9ba82bb2cd95f6c.svg`;
                
                const mediaType = item.media_type || 'movie';
                const tmdbUrl = `viewer.html?url=${encodeURIComponent('https://www.themoviedb.org/' + mediaType + '/' + item.id)}`;

                return [buildSlide('Trending Now', '#00a8e1', title, item.overview, bgUrl, tmdbUrl, 'Details & Trailer', tmdbLogo)];
            } catch (err) {
                console.warn('Trending fetch failed:', err.message);
                return []; 
            }
        }

        async function fetchJellyfin() {
            try {
                if(!CONFIG.jellyfinApiKey || CONFIG.jellyfinApiKey.includes('YOUR_JELLYFIN')) throw new Error("Jellyfin not configured");
                
                const url = `${CONFIG.jellyfinUrl}/Users/${CONFIG.jellyfinUserId}/Items?Recursive=true&IncludeItemTypes=Movie,Series&SortBy=DateCreated&SortOrder=Descending&Limit=50&api_key=${CONFIG.jellyfinApiKey}&Fields=Overview`;
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP Error`);
                const data = await res.json();
                
                let slides = [];
                if (data.Items && data.Items.length > 0) {
                    let randomItems = data.Items.sort(() => 0.5 - Math.random()).slice(0, 5);
                    for (let item of randomItems) {
                        const bgUrl = `${CONFIG.jellyfinUrl}/Items/${item.Id}/Images/Backdrop/0?api_key=${CONFIG.jellyfinApiKey}`;
                        const playbackUrl = `viewer.html?url=${encodeURIComponent(CONFIG.jellyfinUrl + '/web/index.html#!/details?id=' + item.Id)}`;
                        const jellyfinLogo = `https://upload.wikimedia.org/wikipedia/commons/4/41/Jellyfin_-_icon-transparent.svg`;

                        slides.push(buildSlide('From Your Library', '#8b51a5', item.Name, item.Overview || 'Ready to stream instantly on your server.', bgUrl, playbackUrl, 'Watch Now', jellyfinLogo, true));
                    }
                }
                return slides;
            } catch (err) {
                console.warn('Jellyfin fetch failed:', err.message);
                return []; 
            }
        }

        // ==========================================
        // DYNAMIC ESPN INTEGRATION (TEAM COLORS BACKGROUND)
        // ==========================================
        function buildEspnScoreboardSlide(ev, leagueAbbr) {
            const isLive = ev.status === 'in';
            const isPre = ev.status === 'pre';
            const away = ev.competitors?.find(c => c.homeAway === 'away') || ev.competitors?.[0] || {};
            const home = ev.competitors?.find(c => c.homeAway === 'home') || ev.competitors?.[1] || {};

            const awayColor = (away.color || '281818').replace('#', '');
            const homeColor = (home.color || '161826').replace('#', '');
            const awayLogo = away.logo || away.logoDark || 'https://a.espncdn.com/combiner/i?img=/i/teamlogos/default-team-logo-500.png';
            const homeLogo = home.logo || home.logoDark || 'https://a.espncdn.com/combiner/i?img=/i/teamlogos/default-team-logo-500.png';

            let statusPill = '';
            let btnText = 'Watch Now';
            let clockText = ev.summary || '';

            if (isLive) {
                statusPill = `<span class="banner-tag" style="background-color: #ff334b; color: #fff;"><span class="live-pulse"></span>LIVE</span>`;
                btnText = 'Watch Live';
            } else if (isPre) {
                statusPill = `<span class="banner-tag" style="background-color: #ffd700; color: #000;">TODAY</span>`;
                btnText = 'Game Preview';
            } else {
                statusPill = `<span class="banner-tag" style="background-color: #444; color: #fff;">FINAL</span>`;
                btnText = 'Game Recap';
            }

            const broadcastPill = ev.broadcast ? `<span class="broadcast-pill">${ev.broadcast}</span>` : '';
            const espnLogo = `https://upload.wikimedia.org/wikipedia/commons/2/2f/ESPN_wordmark.svg`;
            const watchUrl = `viewer.html?url=${encodeURIComponent(ev.link || 'https://www.espn.com')}`;
            const statsUrl = `stats.html`;

            // Background is vividly the competing team colors
            const bgStyle = `background: linear-gradient(to right, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.25) 50%, rgba(0,0,0,0.85) 100%), linear-gradient(135deg, #${awayColor} 0%, #${awayColor} 50%, #${homeColor} 50%, #${homeColor} 100%);`;

            return `
                <div class="banner-slide espn-banner-slide" style="${bgStyle}">
                    <div class="espn-full-content">
                        <!-- Top Metadata Pill Bar -->
                        <div class="espn-top-bar">
                            <img src="${espnLogo}" class="espn-brand-icon" alt="ESPN">
                            <span class="espn-league-badge">${leagueAbbr}</span>
                            ${statusPill}
                            ${broadcastPill}
                        </div>

                        <!-- Grand Broadcast Scoreboard -->
                        <div class="espn-grand-scoreboard">
                            <div class="espn-grand-team away">
                                <img src="${awayLogo}" class="espn-grand-logo" alt="${away.name}" onerror="this.style.opacity=0.3">
                                <div class="espn-grand-meta">
                                    <span class="espn-grand-name">${away.name || 'Away'}</span>
                                    ${away.record ? `<span class="espn-grand-record">${away.record}</span>` : ''}
                                </div>
                                <span class="espn-grand-score ${away.winner ? 'winner' : ''}">${away.score !== undefined ? away.score : '-'}</span>
                            </div>

                            <div class="espn-grand-center">
                                <span class="espn-clock-main">${isPre ? 'VS' : (isLive ? clockText : 'FINAL')}</span>
                                ${isPre ? `<span class="espn-clock-sub">${clockText}</span>` : ''}
                            </div>

                            <div class="espn-grand-team home">
                                <span class="espn-grand-score ${home.winner ? 'winner' : ''}">${home.score !== undefined ? home.score : '-'}</span>
                                <div class="espn-grand-meta home">
                                    <span class="espn-grand-name">${home.name || 'Home'}</span>
                                    ${home.record ? `<span class="espn-grand-record">${home.record}</span>` : ''}
                                </div>
                                <img src="${homeLogo}" class="espn-grand-logo" alt="${home.name}" onerror="this.style.opacity=0.3">
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="espn-btn-group">
                            <a href="${watchUrl}" class="banner-btn">
                                <svg viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
                                ${btnText}
                            </a>
                            <a href="${statsUrl}" class="banner-btn secondary-btn">
                                <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                                All Matchups
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }

        async function fetchESPN() {
            try {
                const res = await fetch('https://site.api.espn.com/apis/v2/scoreboard/header');
                if (!res.ok) throw new Error(`HTTP Error`);
                const data = await res.json();
                
                const allEvents = [];
                (data.sports || []).forEach(s => {
                    (s.leagues || []).forEach(l => {
                        const abbr = l.abbreviation || l.shortName || l.name || 'SPORTS';
                        (l.events || []).forEach(ev => {
                            allEvents.push({
                                ...ev,
                                leagueAbbr: abbr,
                                broadcast: ev.broadcast || (ev.broadcasts && ev.broadcasts[0] && ev.broadcasts[0].name) || ''
                            });
                        });
                    });
                });

                if (allEvents.length === 0) return [];

                // Prioritize LIVE games first!
                const liveGames = allEvents.filter(e => e.status === 'in');
                const upcomingGames = allEvents.filter(e => e.status === 'pre');
                const finishedGames = allEvents.filter(e => e.status === 'post');

                const slides = [];

                if (liveGames.length > 0) {
                    const selectedLive = liveGames.slice(0, 2);
                    selectedLive.forEach(g => slides.push(buildEspnScoreboardSlide(g, g.leagueAbbr)));
                } else if (upcomingGames.length > 0) {
                    slides.push(buildEspnScoreboardSlide(upcomingGames[0], upcomingGames[0].leagueAbbr));
                } else if (finishedGames.length > 0) {
                    slides.push(buildEspnScoreboardSlide(finishedGames[0], finishedGames[0].leagueAbbr));
                }

                return slides;
            } catch (err) {
                console.warn('ESPN fetch failed:', err.message);
                return []; 
            }
        }

        async function initBanners() {
            // Fetch TMDB, Jellyfin, and ESPN (Weather removed per user request)
            const [theaterHtml, trendingHtml, jellyfinHtml, espnHtml] = await Promise.all([
                fetchInTheaters(),
                fetchTrending(),
                fetchJellyfin(),
                fetchESPN()
            ]);

            // Combine sports and movies/tv slides
            let allSlides = [...espnHtml, ...theaterHtml, ...trendingHtml, ...jellyfinHtml];

            if (loader) loader.remove();
            
            if (allSlides.length === 0) {
                allSlides.push(buildSlide('Welcome', '#ffd700', 'Your Streaming Hub', 'Select an app below to get started.', 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=2500&auto=format&fit=crop'));
            }

            bannerRoot.insertAdjacentHTML('afterbegin', allSlides.join(''));

            let slides = document.querySelectorAll('.banner-slide');
            let currentSlide = 0;
            if (slides.length > 0) {
                slides[currentSlide].classList.add('active');

                if (slides.length > 1) {
                    setInterval(() => {
                        slides[currentSlide].classList.remove('active');
                        currentSlide = (currentSlide + 1) % slides.length;
                        slides[currentSlide].classList.add('active');
                    }, 8000);
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderAppRows();
            initBanners();
        });
    </script>
